<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lauter</title>
<meta name="description" content="Profi-Musikplayer – spielt deine Musik ca. 40% lauter & sauberer. Offline, kein Verzerren.">
<style>
  :root{
    --accent:#ff7a4d; --accent2:#ffa07a; --accentDeep:#e05a2e;
    --text:#f5f5f7; --muted:#b9b9c2; --radius:22px;
    --glass:rgba(30,30,34,.66); --glassLine:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    min-height:100dvh; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    padding:calc(env(safe-area-inset-top) + 12px) 15px calc(env(safe-area-inset-bottom) + 12px);
    background:
      radial-gradient(900px 500px at 50% -8%, rgba(255,122,77,.22), transparent 60%),
      radial-gradient(700px 600px at 100% 0%, rgba(120,90,255,.10), transparent 55%),
      linear-gradient(180deg,#0c0c0e 0%,#070708 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:460px;margin:0 auto;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{
    background:var(--glass); border:1px solid var(--glassLine); border-radius:var(--radius);
    padding:15px; backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .btn{min-height:50px;border:none;border-radius:15px;font-size:15px;font-weight:650;cursor:pointer;
       display:flex;align-items:center;justify-content:center;gap:9px;padding:0 16px;width:100%;letter-spacing:.2px;
       transition:transform .12s cubic-bezier(.2,.8,.2,1),filter .15s}
  .btn.primary{color:#20100a;background:linear-gradient(145deg,var(--accent2),var(--accent) 45%,var(--accentDeep));
               box-shadow:0 10px 26px rgba(255,90,46,.4), inset 0 1px 0 rgba(255,255,255,.4)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--glassLine)}
  .btn:active{transform:scale(.975)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn svg{width:20px;height:20px}
  .btn:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}

  /* Now-Playing */
  .np{display:flex;align-items:center;gap:13px;margin-bottom:14px}
  .cover{width:62px;height:62px;flex:0 0 62px;border-radius:15px;display:grid;place-items:center;position:relative;
         background:linear-gradient(145deg,var(--accent),var(--accentDeep));
         box-shadow:0 10px 24px rgba(255,90,46,.4), inset 0 1px 0 rgba(255,255,255,.3)}
  .cover svg{width:30px;height:30px}
  .np-info{min-width:0;flex:1}
  .np-title{font-size:16px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:inline-flex;align-items:center;gap:4px;margin-top:5px;padding:3px 9px;border-radius:999px;
         font-size:12px;font-weight:800;letter-spacing:.4px;color:#20100a;
         background:linear-gradient(145deg,var(--accent2),var(--accent));box-shadow:0 3px 10px rgba(255,90,46,.4)}
  video#vid{width:100%;max-height:150px;object-fit:contain;background:#000;border-radius:14px;display:block;margin-bottom:12px;
       box-shadow:0 8px 24px rgba(0,0,0,.45)}

  /* Seek + Transport */
  .seekrow{display:flex;align-items:center;gap:9px;margin:2px 0 4px}
  .time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:36px;text-align:center}
  .transport{display:flex;align-items:center;justify-content:center;gap:26px;margin:8px 0 4px}
  .tbtn{width:48px;height:48px;border:none;background:transparent;color:var(--text);cursor:pointer;border-radius:50%;
        display:grid;place-items:center;transition:transform .12s,color .15s}
  .tbtn svg{width:26px;height:26px}
  .tbtn:hover{color:var(--accent2)}
  .tbtn:active{transform:scale(.9)}
  .tbtn.play{width:64px;height:64px;color:#20100a;background:linear-gradient(145deg,var(--accent2),var(--accent) 50%,var(--accentDeep));
             box-shadow:0 10px 26px rgba(255,90,46,.45), inset 0 1px 0 rgba(255,255,255,.4)}
  .tbtn.play svg{width:30px;height:30px}
  .tbtn:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}

  /* Sliders */
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;
        background:linear-gradient(90deg,var(--accent) 0 var(--p,50%),rgba(255,255,255,.14) var(--p,50%) 100%)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;
        background:radial-gradient(circle at 35% 30%,#fff,#e9e9ec);box-shadow:0 3px 8px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.08);transition:transform .12s}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.14)}
  input[type=range]::-moz-range-track{height:6px;border-radius:4px;background:rgba(255,255,255,.14)}
  input[type=range]::-moz-range-progress{height:6px;border-radius:4px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.5)}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(255,122,77,.5)}
  .seek{flex:1}

  /* Collapsible sections */
  .sec{margin-top:13px;border-top:1px solid rgba(255,255,255,.07);padding-top:11px}
  .sec-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:var(--text);font-weight:700;
            letter-spacing:.4px;text-transform:uppercase;user-select:none}
  .sec-head b{color:var(--accent2);font-weight:800;font-variant-numeric:tabular-nums}
  .sec-head .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
  .sec-head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
  .sec-body{margin-top:9px}
  label.row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:9px 3px 3px;font-weight:600;letter-spacing:.3px}
  label.row span:last-child{color:var(--text);font-variant-numeric:tabular-nums}
  .chips{display:flex;gap:5px;margin-bottom:4px;padding:5px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.05)}
  .chip{flex:1;padding:10px 3px;border:none;background:transparent;color:var(--muted);border-radius:10px;font-size:12.5px;
        font-weight:650;cursor:pointer;min-height:42px;letter-spacing:.2px;transition:transform .12s,color .15s,background .2s}
  .chip:hover{color:var(--text)}
  .chip[aria-pressed="true"]{color:#20100a;background:linear-gradient(145deg,var(--accent2),var(--accent));
        box-shadow:0 5px 14px rgba(255,90,46,.4), inset 0 1px 0 rgba(255,255,255,.35)}
  .chip:active{transform:scale(.96)}

  /* Playlist */
  .pl-list{max-height:168px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;padding-right:2px}
  .pl-list::-webkit-scrollbar{width:6px}
  .pl-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  .pl-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;cursor:pointer;
           background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);transition:.15s}
  .pl-item:hover{background:rgba(255,255,255,.09)}
  .pl-item.active{background:linear-gradient(145deg,rgba(255,122,77,.28),rgba(255,122,77,.14));border-color:var(--accent)}
  .pl-item .ic{flex:0 0 18px;font-size:15px}
  .pl-item .nm{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl-item .del{flex:0 0 32px;height:32px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;font-size:16px;display:grid;place-items:center;transition:.15s}
  .pl-item .del:hover{background:rgba(255,80,80,.18);color:#ff8a8a}
  .pl-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:14px 8px;opacity:.75}

  .status{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center;min-height:15px;font-weight:600}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:11px 4px 0;text-align:center}
  .hidden{display:none !important}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a4d">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lauter">
</head>
<body>
<div class="wrap">
  <div class="card">
    <button id="pick" class="btn primary" type="button">＋ Musik / Video hinzufügen</button>
    <input id="file" type="file" accept="audio/*,video/*" class="hidden">
    <a id="yt" class="btn ghost" href="https://m.youtube.com/" target="_blank" rel="noopener" style="margin-top:9px;text-decoration:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff3b30" aria-hidden="true"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 5 12 5 12 5s-7 0-8.9.4A3 3 0 0 0 1 7.5 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.5a3 3 0 0 0 2.1 2.1C5 19 12 19 12 19s7 0 8.9-.4a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23.4 12 31 31 0 0 0 23 7.5zM9.8 15.3V8.7l5.7 3.3z"/></svg>
      YouTube ansehen <span style="opacity:.6;font-weight:500">· werbefrei in Brave</span>
    </a>

    <div id="player" class="hidden" style="margin-top:14px" aria-live="polite">
      <video id="vid" class="hidden" controls playsinline preload="metadata"></video>
      <audio id="aud" preload="metadata" style="display:none"></audio>

      <div class="np" id="np">
        <div class="cover" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#20100a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="np-info">
          <div class="np-title" id="trackTitle">—</div>
          <span class="badge">🔊 +40% LAUTER</span>
        </div>
      </div>

      <div id="transport" class="hidden">
        <div class="seekrow">
          <span class="time" id="cur">0:00</span>
          <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position">
          <span class="time" id="dur">0:00</span>
        </div>
        <div class="transport">
          <button id="prev" class="tbtn" type="button" aria-label="Vorheriges">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button id="pp" class="tbtn play" type="button" aria-label="Abspielen">
            <svg id="ppIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="next" class="tbtn" type="button" aria-label="Nächstes">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6v12l8.5-6zM16 6h2v12h-2z"/></svg>
          </button>
        </div>
      </div>

      <div class="sec">
        <div class="sec-head" id="soundHead" role="button" tabindex="0" aria-expanded="false" aria-controls="soundBody">
          <span>🎚️ Klang</span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="sec-body hidden" id="soundBody">
          <div class="chips" role="group" aria-label="Klang-Stil">
            <button class="chip" data-preset="warmlux" aria-pressed="false">Warm</button>
            <button class="chip" data-preset="concert" aria-pressed="false">Konzert</button>
            <button class="chip" data-preset="studio"  aria-pressed="false">Klar</button>
            <button class="chip" data-preset="autobass" aria-pressed="false">Bass+</button>
          </div>
          <label class="row" for="gain"><span>Lautstärke</span><span id="gainlbl">87 %</span></label>
          <input id="gain" type="range" min="0" max="24" step="1" value="12">
          <label class="row" for="fx_bass"><span>Bass</span><span id="fx_basslbl">0 dB</span></label>
          <input id="fx_bass" type="range" min="-12" max="12" step="1" value="0">
          <label class="row" for="fx_treb"><span>Höhen</span><span id="fx_treblbl">0 dB</span></label>
          <input id="fx_treb" type="range" min="-12" max="12" step="1" value="0">

          <label class="row"><span>🌀 3D Raum (Auto)</span><span id="d3lbl">Aus</span></label>
          <div class="chips" id="d3chips" role="group" aria-label="3D Raum">
            <button class="chip" data-space="0" aria-pressed="true">Aus</button>
            <button class="chip" data-space="1" aria-pressed="false">Breit</button>
            <button class="chip" data-space="2" aria-pressed="false">Rundum</button>
          </div>
        </div>
      </div>

      <div class="sec">
        <button id="dl" class="btn primary" type="button" style="margin-top:2px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 4 5-4"/><path d="M5 21h14"/></svg>
          <span id="dllbl">Lautes Lied speichern</span>
        </button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="sec" id="plSec">
      <div class="sec-head" id="plhead" role="button" tabindex="0" aria-expanded="true" aria-controls="pllist">
        <span>🎧 Meine Musik</span> <b id="plcount"></b>
        <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="pl-list" id="pllist"></div>
    </div>
  </div>

  <p class="hint">🔒 Nur auf deinem Gerät · ⚠️ laut mit Maß</p>
</div>

<script>
"use strict";
(function(){
  var $=function(id){return document.getElementById(id);};
  var fileInput=$('file'), pickBtn=$('pick'), player=$('player');
  var vid=$('vid'), aud=$('aud'), trackTitle=$('trackTitle');
  var transport=$('transport'), seek=$('seek'), curEl=$('cur'), durEl=$('dur');
  var pp=$('pp'), ppIcon=$('ppIcon'), prevBtn=$('prev'), nextBtn=$('next');
  var gain=$('gain'), gainlbl=$('gainlbl'), dlBtn=$('dl'), dllbl=$('dllbl'), statusEl=$('status');
  var fxBass=$('fx_bass'), fxBassL=$('fx_basslbl'), fxTreb=$('fx_treb'), fxTrebL=$('fx_treblbl');
  var chipsWrap=document.querySelector('.chips');
  var plList=$('pllist'), plCount=$('plcount');

  var audioBuf=null, audioPeak=1, origName='lied', isVideo=false, mediaURL=null;
  var repeat=false, currentTrackId=null, tracks=[];

  var fx={ subbass:0, bass:0, mid:0, treble:0, width:1.0, loud:false };
  var PRESETS={
    warmlux:{subbass:2,bass:2,mid:2,treble:3,width:1.15,loud:false},  // warm + klar, Stimme vorn
    concert:{subbass:3,bass:3,mid:0,treble:2,width:1.3,loud:false},   // druckvoll, breiter
    studio:{subbass:0,bass:1,mid:2,treble:3,width:1.05,loud:false},   // sauberste, präzise
    autobass:{subbass:5,bass:5,mid:0,treble:1,width:1.2,loud:false}   // Bass-Lover
  };
  var activePreset='';

  function dbToGain(db){ return Math.pow(10,db/20); }
  function setStatus(t){ statusEl.textContent=t||''; }
  function currentDb(){ return parseInt(gain.value,10)||0; }
  function fmt(s){ s=Math.max(0,s||0); var m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+(r<10?'0':'')+r; }

  // ---- EQ / Kette ----
  function makeEq(c){
    var sub=c.createBiquadFilter();sub.type='lowshelf';sub.frequency.value=70;
    var bass=c.createBiquadFilter();bass.type='peaking';bass.frequency.value=150;bass.Q.value=0.9;
    var mud=c.createBiquadFilter();mud.type='peaking';mud.frequency.value=320;mud.Q.value=1.1;mud.gain.value=-3.5; // stärkerer Matsch-Cut = klarer
    var mid=c.createBiquadFilter();mid.type='peaking';mid.frequency.value=2600;mid.Q.value=0.9; // Präsenz/Stimme deutlicher
    var air=c.createBiquadFilter();air.type='highshelf';air.frequency.value=11000;air.gain.value=2.5; // feste "Luft" = frischer/klarer
    var treb=c.createBiquadFilter();treb.type='highshelf';treb.frequency.value=7500;
    sub.connect(bass);bass.connect(mud);mud.connect(mid);mid.connect(air);air.connect(treb);
    return {first:sub,last:treb,sub:sub,bass:bass,mid:mid,treb:treb};
  }
  function applyEq(eq){ eq.sub.gain.value=fx.subbass;eq.bass.gain.value=fx.bass;eq.mid.gain.value=fx.mid;eq.treb.gain.value=fx.treble; }
  function makeWidth(c){
    var sp=c.createChannelSplitter(2);
    var Lm=c.createGain();Lm.gain.value=0.5;var Rm=c.createGain();Rm.gain.value=0.5;sp.connect(Lm,0);sp.connect(Rm,1);
    var mid=c.createGain();Lm.connect(mid);Rm.connect(mid);
    var Ls=c.createGain();var Rs=c.createGain();sp.connect(Ls,0);sp.connect(Rs,1);
    var side=c.createGain();Ls.connect(side);Rs.connect(side);
    var sn=c.createGain();sn.gain.value=-1;side.connect(sn);
    var Lo=c.createGain();mid.connect(Lo);side.connect(Lo);
    var Ro=c.createGain();mid.connect(Ro);sn.connect(Ro);
    var mg=c.createChannelMerger(2);Lo.connect(mg,0,0);Ro.connect(mg,0,1);
    return {first:sp,last:mg,Ls:Ls,Rs:Rs};
  }
  // 3D Raum (Auto): 0 Aus · 1 Breit · 2 Rundum
  var space=0;
  function effectiveWidth(){ return space===1?1.55 : space===2?1.95 : fx.width; }
  function spaceWet(){ return space===2?0.12:0; }  // nur Rundum = dezenter, klarer Raum
  function makeImpulse(c){
    var len=Math.floor(c.sampleRate*0.26), b=c.createBuffer(2,len,c.sampleRate); // kürzer = klarer, schneller
    for(var ch=0;ch<2;ch++){ var d=b.getChannelData(ch); for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2); } }
    return b;
  }
  function applyWidth(w){ var ww=effectiveWidth(); w.Ls.gain.value=0.5*ww; w.Rs.gain.value=-0.5*ww; }

  function buildChain(c,src,driveFactor,channels,store,live){
    var eq=makeEq(c);applyEq(eq);src.connect(eq.first);
    var node=eq.last,width=null,wet=null;
    if(channels>=2){ width=makeWidth(c);applyWidth(width);eq.last.connect(width.first);node=width.last; }
    if(live){ // 3D-Raum: paralleler Reverb-Weg (wet=0 wenn aus -> transparent)
      var conv=c.createConvolver(); conv.buffer=makeImpulse(c);
      wet=c.createGain(); wet.gain.value=spaceWet();
      var merge=c.createGain();
      node.connect(merge); node.connect(conv); conv.connect(wet); wet.connect(merge);
      node=merge;
    }
    var i=currentDb()/24, loud=fx.loud?1:0;
    var drive=c.createGain();drive.gain.value=driveFactor*(1+loud*0.6);
    var comp=c.createDynamicsCompressor();
    if(live){ comp.threshold.value=-6;comp.knee.value=10;comp.ratio.value=2.3;comp.attack.value=0.02;comp.release.value=0.25; } // lockerer = mehr Punch/Dynamik
    else{ comp.threshold.value=-3-i*7-loud*6;comp.knee.value=6;comp.ratio.value=6+i*14+loud*4;comp.attack.value=0.003;comp.release.value=0.25; }
    var limNode=null;
    if(live && workletReady && typeof AudioWorkletNode!=='undefined'){
      try{ limNode=new AudioWorkletNode(c,'limiter',{channelCount:2,channelCountMode:'explicit',outputChannelCount:[2]}); }catch(e){ limNode=null; }
    }
    if(!limNode){ // Fallback ohne Worklet
      var lim=c.createDynamicsCompressor();
      lim.threshold.value=-1;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=live?0.002:0.001;lim.release.value=live?0.10:0.05;
      limNode=lim;
    }
    var trim=c.createGain();trim.gain.value=live?0.99:0.9;
    var out=c.createGain();out.gain.value=1;
    node.connect(drive);drive.connect(comp);comp.connect(limNode);limNode.connect(trim);trim.connect(out);
    if(store){ store.eq=eq;store.width=width;store.drive=drive;store.comp=comp;store.out=out;store.wet=wet; }
    return out;
  }
  function peakOf(buf){ var p=0;for(var ch=0;ch<buf.numberOfChannels;ch++){var d=buf.getChannelData(ch);for(var i=0;i<d.length;i++){var a=Math.abs(d[i]);if(a>p)p=a;}}return p||1; }
  function totalGain(){ var norm=audioBuf?(0.99/audioPeak):1; return norm*dbToGain(currentDb()); }
  // Basis = auf Vollpegel normalisiert (schon laut + punchy). Regler legt 0..14 dB Antrieb drauf:
  // unten = max Punch/Dynamik, oben = maximal laut. Darüber bringt mehr Antrieb nur Matsch, kein Plus.
  function liveDrive(){ var driveDb = (currentDb()/24)*14; return (audioBuf?(0.99/audioPeak):1) * dbToGain(driveDb); }

  // ---- LIVE Media-Graph ----
  var mctx=null, graphs=new WeakMap(), mStore=null, mAnalyser=null, mDest=null, mEl=null, workletReady=false;
  // Limiter-Worklet inline (als Blob geladen -> läuft auch in der Mac-App über file://)
  var WORKLET_CODE = [
    "class L extends AudioWorkletProcessor{",
    "constructor(){super();this.c=0.97;this.l=Math.max(16,Math.round(0.003*sampleRate));this.r=Math.exp(-1/(0.08*sampleRate));this.g=1;this.b=null;this.i=0;}",
    "process(ins,outs){const I=ins[0],O=outs[0];if(!I||!I.length)return true;const ch=I.length,n=I[0]?I[0].length:0;",
    "if(!this.b||this.b.length!==ch){this.b=[];for(let c=0;c<ch;c++)this.b.push(new Float32Array(this.l));this.i=0;}",
    "const L=this.l,C=this.c,R=this.r;let g=this.g,idx=this.i;",
    "for(let i=0;i<n;i++){let p=0;for(let c=0;c<ch;c++){const a=Math.abs(I[c][i]);if(a>p)p=a;}",
    "const t=p>C?C/p:1;if(t<g){g=t;}else{g=g*R+t*(1-R);if(g>1)g=1;}",
    "for(let c=0;c<ch;c++){const bf=this.b[c];const d=bf[idx];bf[idx]=I[c][i];let y=d*g;if(y>C)y=C;else if(y<-C)y=-C;if(O[c])O[c][i]=y;}",
    "idx++;if(idx>=L)idx=0;}this.g=g;this.i=idx;return true;}}",
    "registerProcessor('limiter',L);"
  ].join("");
  function initAudio(){
    if(!mctx){ mctx=new (window.AudioContext||window.webkitAudioContext)(); }
    if(!workletReady && mctx.audioWorklet){
      var p;
      try{ var u=URL.createObjectURL(new Blob([WORKLET_CODE],{type:'application/javascript'})); p=mctx.audioWorklet.addModule(u); }
      catch(e){ p=mctx.audioWorklet.addModule('limiter-worklet.js'); }
      p.then(function(){ workletReady=true; }).catch(function(){
        mctx.audioWorklet.addModule('limiter-worklet.js').then(function(){ workletReady=true; }).catch(function(){ workletReady=false; });
      });
    }
  }
  function buildMediaGraph(el){
    initAudio();
    var g=graphs.get(el);
    if(!g){
      var src=mctx.createMediaElementSource(el);
      var an=mctx.createAnalyser();an.fftSize=256;
      var dest=mctx.createMediaStreamDestination();
      var store={};
      var last=buildChain(mctx,src,liveDrive(),2,store,true);
      last.connect(an);an.connect(mctx.destination);an.connect(dest);
      g={src:src,store:store,analyser:an,dest:dest};
      graphs.set(el,g);
    }
    mEl=el;mStore=g.store;mAnalyser=g.analyser;mDest=g.dest;
  }
  function setP(param,val){ try{ param.setTargetAtTime(val, mctx.currentTime, 0.02); }catch(e){ try{param.value=val;}catch(_){} } } // ~60 ms = sofort & klickfrei
  function updateMediaFx(){
    if(!mctx||!mStore||!mStore.eq) return;
    var eq=mStore.eq;
    setP(eq.sub.gain,fx.subbass); setP(eq.bass.gain,fx.bass); setP(eq.mid.gain,fx.mid); setP(eq.treb.gain,fx.treble);
    if(mStore.width){ var ww=effectiveWidth(); setP(mStore.width.Ls.gain,0.5*ww); setP(mStore.width.Rs.gain,-0.5*ww); }
    if(mStore.wet) setP(mStore.wet.gain, spaceWet());
    var loud=fx.loud?1:0;
    setP(mStore.drive.gain, liveDrive()*(1+loud*0.6));
  }

  // ---- Export (nur Audio): Mastering ----
  var CEIL=Math.pow(10,-1/20), LUFS_TARGET=-11;
  function softLimit(chs,sr,ceiling){var n=chs[0].length,nc=chs.length,atk=Math.exp(-1/(sr*0.002)),rel=Math.exp(-1/(sr*0.08)),g=1;for(var i=0;i<n;i++){var p=0;for(var c=0;c<nc;c++){var a=Math.abs(chs[c][i]);if(a>p)p=a;}var req=p>ceiling?ceiling/p:1,coef=req<g?atk:rel;g=coef*g+(1-coef)*req;if(g>req)g=req;for(var c2=0;c2<nc;c2++)chs[c2][i]*=g;}}
  function measureLUFS(buf){var s1b0=1.53512485958697,s1b1=-2.69169618940638,s1b2=1.19839281085285,s1a1=-1.69065929318241,s1a2=0.73248077421585;var s2b0=1,s2b1=-2,s2b2=1,s2a1=-1.99004745483398,s2a2=0.99007225036621,sum=0;for(var ch=0;ch<buf.numberOfChannels;ch++){var d=buf.getChannelData(ch),x1=0,x2=0,y1=0,y2=0,z1=0,z2=0,w1=0,w2=0,ms=0;for(var i=0;i<d.length;i++){var x=d[i];var y=s1b0*x+s1b1*x1+s1b2*x2-s1a1*y1-s1a2*y2;x2=x1;x1=x;y2=y1;y1=y;var w=s2b0*y+s2b1*z1+s2b2*z2-s2a1*w1-s2a2*w2;z2=z1;z1=y;w2=w1;w1=w;ms+=w*w;}sum+=ms/(d.length||1);}return -0.691+10*Math.log10(sum+1e-12);}
  function resampleBuffer(inBuf,tr){return new Promise(function(res,rej){var Off=window.OfflineAudioContext||window.webkitOfflineAudioContext;var len=Math.max(1,Math.ceil(inBuf.duration*tr));var off=new Off(inBuf.numberOfChannels,len,tr);var s=off.createBufferSource();s.buffer=inBuf;var lp=off.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(tr*0.45,20000);lp.Q.value=0.707;s.connect(lp);lp.connect(off.destination);s.start();off.startRendering().then(res).catch(rej);});}
  function renderLoud(){
    var Off=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    if(!Off) return Promise.reject('Browser kann nicht exportieren.');
    var sr=audioBuf.sampleRate, osRate=Math.min(4*sr,192000), len=Math.max(1,Math.ceil(audioBuf.duration*osRate));
    var off=new Off(audioBuf.numberOfChannels,len,osRate);
    var src=off.createBufferSource();src.buffer=audioBuf;
    buildChain(off,src,totalGain(),audioBuf.numberOfChannels,null).connect(off.destination);src.start();
    return off.startRendering().then(function(osBuf){
      var chs=[];for(var c=0;c<osBuf.numberOfChannels;c++)chs.push(osBuf.getChannelData(c));
      softLimit(chs,osRate,CEIL);return resampleBuffer(osBuf,sr);
    }).then(function(fin){
      var lufs=measureLUFS(fin),makeup=Math.max(-6,Math.min(4,LUFS_TARGET-lufs)),k=Math.pow(10,makeup/20);
      var chs=[];for(var c=0;c<fin.numberOfChannels;c++){var d=fin.getChannelData(c);for(var i=0;i<d.length;i++)d[i]*=k;chs.push(d);}
      softLimit(chs,fin.sampleRate,CEIL);fin._lufs=measureLUFS(fin);return fin;
    });
  }
  function bufToWav24(buf){
    var numCh=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate,bps=3,dataLen=len*numCh*bps,bytes=44+dataLen,ab=new ArrayBuffer(bytes),v=new DataView(ab);
    function ws(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}
    ws(0,'RIFF');v.setUint32(4,bytes-8,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,numCh,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*numCh*bps,true);v.setUint16(32,numCh*bps,true);v.setUint16(34,24,true);ws(36,'data');v.setUint32(40,dataLen,true);
    var chans=[];for(var c=0;c<numCh;c++)chans.push(buf.getChannelData(c));
    var off=44,scale=8388607,q=1/8388607;
    for(var i=0;i<len;i++){for(var c2=0;c2<numCh;c2++){var s=chans[c2][i]+(Math.random()-Math.random())*q;if(s>1)s=1;else if(s<-1)s=-1;var val=Math.round(s*scale);if(val>8388607)val=8388607;else if(val<-8388608)val=-8388608;v.setUint8(off,val&0xFF);v.setUint8(off+1,(val>>8)&0xFF);v.setUint8(off+2,(val>>16)&0xFF);off+=3;}}
    return new Blob([ab],{type:'audio/wav'});
  }
  var recording=false, mediaRec=null;
  function recordVideo(){
    buildMediaGraph(vid); if(mctx.state==='suspended') mctx.resume(); updateMediaFx();
    var trks=[]; var vs=vid.captureStream?vid.captureStream():(vid.mozCaptureStream&&vid.mozCaptureStream());
    if(vs&&vs.getVideoTracks()[0]) trks.push(vs.getVideoTracks()[0]);
    trks.push(mDest.stream.getAudioTracks()[0]);
    var stream=new MediaStream(trks);
    var mime=MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':(MediaRecorder.isTypeSupported('video/webm')?'video/webm':'');
    var chunks=[];
    try{ mediaRec=new MediaRecorder(stream,mime?{mimeType:mime}:{}); }catch(e){ setStatus('Aufnahme nicht möglich: '+e); dlBtn.disabled=false; return; }
    mediaRec.ondataavailable=function(ev){ if(ev.data&&ev.data.size) chunks.push(ev.data); };
    mediaRec.onstop=function(){
      var ext=mime.indexOf('mp4')>-1?'mp4':'webm', blob=new Blob(chunks,{type:mime||'application/octet-stream'});
      var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=origName+'_lauter.'+ext;
      document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},4000);
      setStatus('✅ Gespeichert: '+a.download);recording=false;dlBtn.disabled=false;
    };
    recording=true;dlBtn.disabled=true;setStatus('⏺ Nehme auf … (läuft 1× komplett durch)');
    vid.currentTime=0;vid.muted=false;mediaRec.start();vid.play();
    vid.onended=function(){ if(recording&&mediaRec.state!=='inactive') mediaRec.stop(); };
  }
  function download(){
    if(isVideo){ recordVideo(); return; }
    if(!audioBuf){ return; }
    dlBtn.disabled=true; setStatus('Studio-Mastering läuft …');
    renderLoud().then(function(out){
      var blob=bufToWav24(out),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=origName+'_lauter_24bit.wav';document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      setStatus('✅ Gespeichert (24-bit): '+a.download); dlBtn.disabled=false;
    }).catch(function(e){ setStatus('Fehler: '+e); dlBtn.disabled=false; });
  }

  // ---- Media laden ----
  function resetMedia(){
    try{aud.pause();}catch(e){} try{vid.pause();}catch(e){}
    if(mediaURL){ URL.revokeObjectURL(mediaURL); mediaURL=null; }
    audioBuf=null; isVideo=false;
    vid.classList.add('hidden'); vid.removeAttribute('src'); try{vid.load();}catch(e){}
    aud.removeAttribute('src'); try{aud.load();}catch(e){}
    setPlayIcon(false);
  }
  function isMedia(name,type){ return /^video\//.test(type)||/^audio\//.test(type)||/\.(mp4|mov|m4v|webm|mkv|avi|mp3|m4a|wav|aac|ogg|flac)$/i.test(name||''); }

  function openMedia(blob,name,type){
    resetMedia();
    origName=(name||'datei').replace(/\.[^.]+$/,'')||'datei';
    trackTitle.textContent=name||'Datei';
    mediaURL=URL.createObjectURL(blob);
    player.classList.remove('hidden');
    var video=/^video\//.test(type)||/\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(name||'');
    if(video){
      isVideo=true;
      vid.src=mediaURL; vid.loop=repeat; vid.classList.remove('hidden');
      transport.classList.add('hidden');      // Video nutzt eigene Steuerung (inkl. Vollbild)
      dllbl.textContent='Lautes Video speichern';
      buildMediaGraph(vid); updateMediaFx();
      setStatus('Video geladen – Play drücken.');
      return;
    }
    isVideo=false;
    aud.src=mediaURL; aud.loop=repeat;
    transport.classList.remove('hidden');
    dllbl.textContent='Lautes Lied speichern';
    buildMediaGraph(aud); updateMediaFx();
    setStatus('Lade …');
    var reader=new FileReader();
    reader.onload=function(){
      var ac=new (window.AudioContext||window.webkitAudioContext)();
      ac.decodeAudioData(reader.result).then(function(buf){ audioBuf=buf; audioPeak=peakOf(buf); ac.close(); updateMediaFx(); setStatus('Bereit – Play drücken.'); })
      .catch(function(){ ac.close(); setStatus('Diese Datei konnte nicht gelesen werden.'); });
    };
    reader.onerror=function(){ setStatus('Datei-Fehler.'); };
    reader.readAsArrayBuffer(blob);
  }
  function loadFile(f){
    if(!f) return;
    if(!isMedia(f.name,f.type)){ setStatus('Bitte Audio- oder Video-Datei wählen.'); return; }
    openMedia(f,f.name,f.type);
    idbAll().then(function(list){
      var dup=null,bk=baseKey(f.name);
      for(var i=0;i<list.length;i++){ if(baseKey(list[i].name)===bk){ dup=list[i]; break; } }
      if(dup){ currentTrackId=dup.id; renderList(); return; }
      var id='t'+Date.now()+'_'+Math.random().toString(36).slice(2,7); currentTrackId=id;
      return idbAdd({id:id,name:f.name,type:f.type||'',blob:f,added:Date.now()}).then(renderList);
    }).catch(function(){});
  }

  // ---- Transport (Audio) ----
  function setPlayIcon(playing){
    ppIcon.innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    pp.setAttribute('aria-label', playing?'Pause':'Abspielen');
  }
  function activeEl(){ return isVideo?vid:aud; }
  pp.addEventListener('click', function(){ var el=activeEl(); if(el.paused){ el.play(); } else { el.pause(); } });
  aud.addEventListener('play', function(){ buildMediaGraph(aud); if(mctx.state==='suspended') mctx.resume(); updateMediaFx(); setPlayIcon(true); });
  aud.addEventListener('pause', function(){ setPlayIcon(false); });
  aud.addEventListener('ended', function(){ if(!repeat) playNeighbor(1); });
  aud.addEventListener('loadedmetadata', function(){ durEl.textContent=fmt(aud.duration); });
  aud.addEventListener('timeupdate', function(){
    if(!aud.duration) return;
    seek.value=Math.round(aud.currentTime/aud.duration*1000);
    seek.style.setProperty('--p',(aud.currentTime/aud.duration*100)+'%');
    curEl.textContent=fmt(aud.currentTime);
  });
  seek.addEventListener('input', function(){ if(aud.duration){ aud.currentTime=seek.value/1000*aud.duration; } });
  prevBtn.addEventListener('click', function(){ if(aud.currentTime>3){ aud.currentTime=0; } else { playNeighbor(-1); } });
  nextBtn.addEventListener('click', function(){ playNeighbor(1); });
  function playNeighbor(dir){
    if(!tracks.length) return;
    var idx=-1; for(var i=0;i<tracks.length;i++){ if(tracks[i].id===currentTrackId){ idx=i; break; } }
    var ni=idx+dir; if(ni<0) ni=tracks.length-1; if(ni>=tracks.length) ni=0;
    if(tracks[ni]) playTrack(tracks[ni].id);
  }

  // ---- Playlist (IndexedDB, dauerhaft) ----
  var DB=null;
  function idbOpen(){ return new Promise(function(res,rej){ if(!window.indexedDB){rej('no-idb');return;} var r=indexedDB.open('lauter_pl',1); r.onupgradeneeded=function(){ if(!r.result.objectStoreNames.contains('tracks')) r.result.createObjectStore('tracks',{keyPath:'id'}); }; r.onsuccess=function(){DB=r.result;res(DB);}; r.onerror=function(){rej(r.error);}; }); }
  function idbAdd(t){ return new Promise(function(res,rej){ if(!DB){res();return;} try{var tx=DB.transaction('tracks','readwrite');tx.objectStore('tracks').put(t);tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};}catch(e){rej(e);} }); }
  function idbAll(){ return new Promise(function(res){ if(!DB){res([]);return;} try{var tx=DB.transaction('tracks','readonly');var q=tx.objectStore('tracks').getAll();q.onsuccess=function(){res((q.result||[]).sort(function(a,b){return a.added-b.added;}));};q.onerror=function(){res([]);};}catch(e){res([]);} }); }
  function idbGet(id){ return new Promise(function(res){ if(!DB){res(null);return;} try{var tx=DB.transaction('tracks','readonly');var q=tx.objectStore('tracks').get(id);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};}catch(e){res(null);} }); }
  function idbDel(id){ return new Promise(function(res){ if(!DB){res();return;} try{var tx=DB.transaction('tracks','readwrite');tx.objectStore('tracks').delete(id);tx.oncomplete=res;tx.onerror=res;}catch(e){res();} }); }
  function baseKey(name){ return (name||'').replace(/\.[^.]+$/,'').trim().toLowerCase(); }

  function renderList(){
    return idbAll().then(function(list){
      var seen={},uniq=[],dups=[];
      list.forEach(function(t){ var k=baseKey(t.name); if(seen[k]){ dups.push(t.id); } else { seen[k]=true; uniq.push(t); } });
      dups.forEach(function(id){ idbDel(id); });
      tracks=uniq;
      plCount.textContent=uniq.length?'('+uniq.length+')':'';
      plList.innerHTML='';
      if(!uniq.length){ var e=document.createElement('div');e.className='pl-empty';e.textContent='Noch keine Musik – oben „Musik / Video hinzufügen".';plList.appendChild(e);return; }
      uniq.forEach(function(t){
        var isVid=/^video\//.test(t.type)||/\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(t.name);
        var item=document.createElement('div');item.className='pl-item'+(t.id===currentTrackId?' active':'');item.setAttribute('role','button');
        var ic=document.createElement('span');ic.className='ic';ic.textContent=isVid?'🎬':'🎵';
        var nm=document.createElement('span');nm.className='nm';nm.textContent=t.name;
        var del=document.createElement('button');del.className='del';del.type='button';del.setAttribute('aria-label','Löschen');del.textContent='🗑';
        item.appendChild(ic);item.appendChild(nm);item.appendChild(del);
        item.addEventListener('click',function(e){ if(e.target===del) return; playTrack(t.id); });
        del.addEventListener('click',function(e){ e.stopPropagation(); idbDel(t.id).then(function(){ if(currentTrackId===t.id) currentTrackId=null; renderList(); }); });
        plList.appendChild(item);
      });
    });
  }
  function playTrack(id){
    idbGet(id).then(function(t){ if(!t) return; currentTrackId=id; openMedia(t.blob,t.name,t.type); renderList();
      setTimeout(function(){ var el=activeEl(); if(el&&el.play) el.play().catch(function(){}); },180);
    });
  }

  // ---- Regler / Presets ----
  function rangeFill(el){ var mn=+el.min,mx=+el.max,p=(parseFloat(el.value)-mn)/(mx-mn)*100; el.style.setProperty('--p',p+'%'); }
  function updateGainLabel(){ gainlbl.textContent=Math.round(currentDb()/24*100)+' %'; rangeFill(gain); }
  function updateFxLabels(){
    fxBassL.textContent=(fx.bass>0?'+':'')+fx.bass+' dB';
    fxTrebL.textContent=(fx.treble>0?'+':'')+fx.treble+' dB';
    fxBass.value=fx.bass; fxTreb.value=fx.treble; rangeFill(fxBass); rangeFill(fxTreb);
  }
  function markPreset(name){ activePreset=name||''; chipsWrap.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.preset===activePreset?'true':'false'); }); }
  function applyPreset(name){ var p=PRESETS[name]; if(!p) return; fx.subbass=p.subbass;fx.bass=p.bass;fx.mid=p.mid;fx.treble=p.treble;fx.width=p.width;fx.loud=p.loud; updateFxLabels(); markPreset(name); updateMediaFx(); }

  pickBtn.addEventListener('click', function(){ fileInput.click(); });
  // YouTube-Knopf: am Mac öffnet er sauber Brave/YouTube.app. Am iPhone erzwingt iOS ein Safari-Fenster
  // (mit Werbung) und ignoriert Brave -> darum auf iPhone/iPad ausblenden (ehrlich, kein falsches Versprechen).
  (function(){ var yt=document.getElementById('yt'); if(yt && /iPhone|iPad|iPod/.test(navigator.userAgent||'')) yt.style.display='none'; })();
  fileInput.addEventListener('change', function(e){ if(e.target.files[0]) loadFile(e.target.files[0]); fileInput.value=''; });
  chipsWrap.addEventListener('click', function(e){ var b=e.target.closest('button'); if(b) applyPreset(b.dataset.preset); });
  gain.addEventListener('input', function(){ updateGainLabel(); updateMediaFx(); });
  fxBass.addEventListener('input', function(){ fx.bass=parseInt(fxBass.value,10)||0; updateFxLabels(); markPreset(''); updateMediaFx(); });
  fxTreb.addEventListener('input', function(){ fx.treble=parseInt(fxTreb.value,10)||0; updateFxLabels(); markPreset(''); updateMediaFx(); });
  dlBtn.addEventListener('click', download);

  // 3D Raum (Auto) – live umschaltbar, kein Neustart
  var d3chips=$('d3chips'), d3lbl=$('d3lbl');
  d3chips.addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    space=parseInt(b.dataset.space,10)||0;
    d3chips.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
    d3lbl.textContent = space===1?'Breit':(space===2?'Rundum':'Aus');
    updateMediaFx();
  });

  // Aufklappen (Klang + Meine Musik)
  function wireCollapse(headId, bodyId){
    var head=$(headId), body=$(bodyId);
    function toggle(){ var open=head.getAttribute('aria-expanded')==='true'; head.setAttribute('aria-expanded',open?'false':'true'); body.classList.toggle('hidden',open); }
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  }
  wireCollapse('soundHead','soundBody');
  wireCollapse('plhead','pllist');

  // iOS: AudioContext bei Berührung aufwecken
  function resumeCtx(){ if(mctx&&mctx.state==='suspended'){ mctx.resume(); updateMediaFx(); } }
  document.addEventListener('touchend', resumeCtx, {passive:true});
  document.addEventListener('click', resumeCtx);

  applyPreset('warmlux'); updateGainLabel();
  initAudio();   // Limiter-Worklet früh laden (sauberer Laut-Limiter bereit)
  idbOpen().then(renderList).catch(function(){ renderList(); });

  if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); }); }
})();
</script>
