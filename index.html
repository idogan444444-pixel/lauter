<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lauter</title>
<meta name="description" content="Lauter & besserer Klang für Lieder und Videos – Studio-Mastering, offline, kein Verzerren.">
<style>
  :root{
    --accent:#ff7a4d; --accent2:#ffa07a; --accentDeep:#e05a2e;
    --text:#f5f5f7; --muted:#b9b9c2; --radius:22px;
    --glass:rgba(30,30,34,.66); --glassLine:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    min-height:100dvh; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    padding:calc(env(safe-area-inset-top) + 12px) 15px calc(env(safe-area-inset-bottom) + 12px);
    background:
      radial-gradient(900px 500px at 50% -8%, rgba(255,122,77,.22), transparent 60%),
      radial-gradient(700px 600px at 100% 0%, rgba(120,90,255,.10), transparent 55%),
      linear-gradient(180deg,#0c0c0e 0%,#070708 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:460px;margin:0 auto;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  header{display:flex;align-items:center;gap:12px;padding:18px 4px 14px}
  .logo{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:grid;place-items:center;
        background:linear-gradient(150deg,var(--accent),var(--accentDeep));
        box-shadow:0 8px 22px rgba(255,90,46,.42), inset 0 1px 0 rgba(255,255,255,.3)}
  .logo svg{width:24px;height:24px}
  h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.5px}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.1px}
  .card{
    background:var(--glass); border:1px solid var(--glassLine); border-radius:var(--radius);
    padding:15px; backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .btn{min-height:52px;border:none;border-radius:15px;font-size:15.5px;font-weight:650;cursor:pointer;
       display:flex;align-items:center;justify-content:center;gap:9px;padding:0 16px;width:100%;
       letter-spacing:.2px;transition:transform .12s cubic-bezier(.2,.8,.2,1),filter .15s,box-shadow .15s}
  .btn.primary{color:#20100a;background:linear-gradient(145deg,var(--accent2),var(--accent) 45%,var(--accentDeep));
               box-shadow:0 10px 26px rgba(255,90,46,.4), inset 0 1px 0 rgba(255,255,255,.4)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn:active{transform:scale(.975)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
  .btn svg{width:20px;height:20px}
  .btn:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
  #vid{width:100%;max-height:150px;object-fit:contain;background:#000;border-radius:14px;display:block;margin-bottom:10px;
       box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #aud{width:100%;margin-bottom:10px;display:block;border-radius:12px}
  .fname{font-size:12.5px;color:var(--muted);margin:2px 2px 12px;text-align:center;font-weight:600;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chips{display:flex;gap:5px;margin-bottom:4px;padding:5px;border-radius:15px;
         background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.05)}
  .chip{flex:1;padding:11px 3px;border:none;background:transparent;color:var(--muted);
        border-radius:11px;font-size:13px;font-weight:650;cursor:pointer;min-height:44px;letter-spacing:.2px;
        transition:transform .12s,color .15s,background .2s}
  .chip:hover{color:var(--text)}
  .chip[aria-pressed="true"]{color:#20100a;background:linear-gradient(145deg,var(--accent2),var(--accent));
        box-shadow:0 5px 14px rgba(255,90,46,.4), inset 0 1px 0 rgba(255,255,255,.35)}
  .chip:active{transform:scale(.96)}
  .chip:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  label.row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:10px 3px 4px;
            font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  label.row span:last-child{color:var(--text);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:4px;
        background:linear-gradient(90deg,var(--accent) 0 var(--p,50%),rgba(255,255,255,.14) var(--p,50%) 100%)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;
        border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9e9ec);
        box-shadow:0 3px 8px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.08);transition:transform .12s}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.14)}
  input[type=range]::-moz-range-track{height:7px;border-radius:4px;background:rgba(255,255,255,.14)}
  input[type=range]::-moz-range-progress{height:7px;border-radius:4px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border:none;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.5)}
  input[type=range]:focus-visible{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(255,122,77,.5)}
  .meter{height:9px;border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden;margin:14px 0 2px;
         border:1px solid rgba(255,255,255,.06)}
  .meter i{display:block;height:100%;width:0;border-radius:6px;
           background:linear-gradient(90deg,#3ddc84,#e3c34a 65%,#ff5a4a);
           box-shadow:0 0 12px rgba(255,120,80,.5);transition:width .05s linear}
  .btns{margin-top:16px}
  .status{font-size:12.5px;color:var(--muted);margin-top:12px;text-align:center;min-height:16px;font-weight:600}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:14px 4px 0;text-align:center}
  .row2{display:flex;gap:10px;margin-top:10px}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--glassLine);
             box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .btn.ghost[aria-pressed="true"]{background:linear-gradient(145deg,var(--accent2),var(--accent));color:#20100a;
             box-shadow:0 6px 16px rgba(255,90,46,.35)}
  .btn.sm{min-height:46px;font-size:14px}
  .pl{margin-top:12px}
  .pl-head{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;
           letter-spacing:.4px;text-transform:uppercase;margin:0 3px 6px}
  .pl-head b{color:var(--accent2);font-variant-numeric:tabular-nums}
  .pl-list{max-height:112px;overflow-y:auto;-webkit-overflow-scrolling:touch;
           display:flex;flex-direction:column;gap:6px;padding-right:2px}
  .pl-list::-webkit-scrollbar{width:6px}
  .pl-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  .pl-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;
           background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);transition:.15s}
  .pl-item:hover{background:rgba(255,255,255,.09);border-color:var(--glassLine)}
  .pl-item.active{background:linear-gradient(145deg,rgba(255,122,77,.28),rgba(255,122,77,.14));border-color:var(--accent)}
  .pl-item .ic{flex:0 0 18px;font-size:15px;opacity:.9}
  .pl-item .nm{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl-item .del{flex:0 0 32px;height:32px;border:none;background:transparent;color:var(--muted);cursor:pointer;
                border-radius:8px;font-size:16px;display:grid;place-items:center;transition:.15s}
  .pl-item .del:hover{background:rgba(255,80,80,.18);color:#ff8a8a}
  .pl-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:14px 8px;opacity:.75}
  .hidden{display:none !important}
</style>

<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<body>
<div class="wrap">
  <div class="card">
    <button id="pick" class="btn primary" type="button">🎵 Lied / Video wählen</button>
    <input id="file" type="file" accept="audio/*,video/*" class="hidden">

    <div class="pl" id="pl">
      <div class="pl-head">🎧 Meine Musik <b id="plcount"></b></div>
      <div class="pl-list" id="pllist"></div>
    </div>

    <div id="panel" class="hidden" aria-live="polite" style="margin-top:12px">
      <video id="vid" class="hidden" controls playsinline preload="metadata"></video>
      <audio id="aud" class="hidden" controls preload="metadata"></audio>
      <div class="fname" id="fname">—</div>

      <div class="chips" role="group" aria-label="Klang">
        <button class="chip" data-preset="warmlux" aria-pressed="false">Warm</button>
        <button class="chip" data-preset="concert" aria-pressed="false">Konzert</button>
        <button class="chip" data-preset="studio"  aria-pressed="false">Klar</button>
        <button class="chip" data-preset="autobass" aria-pressed="false">Bass+</button>
      </div>

      <label class="row" for="gain"><span>Lautstärke</span><span id="gainlbl">87 %</span></label>
      <input id="gain" type="range" min="0" max="24" step="1" value="20">

      <label class="row" for="fx_bass"><span>Bass</span><span id="fx_basslbl">0 dB</span></label>
      <input id="fx_bass" type="range" min="-12" max="12" step="1" value="0">

      <label class="row" for="fx_treb"><span>Höhen</span><span id="fx_treblbl">0 dB</span></label>
      <input id="fx_treb" type="range" min="-12" max="12" step="1" value="0">

      <div class="meter" aria-hidden="true"><i id="meter"></i></div>

      <div class="row2">
        <button id="rep" class="btn ghost sm" type="button" aria-pressed="false" style="flex:0 0 auto;width:auto;padding:0 16px">🔁 Wiederholen</button>
        <button id="dl" class="btn primary sm" type="button" style="flex:1">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 4 5-4"/><path d="M5 21h14"/></svg>
          <span id="dllbl">Speichern</span>
        </button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <p class="hint">🔒 Nur auf deinem Gerät · ⚠️ laut mit Maß</p>
</div>

<script>
"use strict";
(function(){
  var fileInput = document.getElementById('file');
  var pickBtn   = document.getElementById('pick');
  var panel     = document.getElementById('panel');
  var fname     = document.getElementById('fname');
  var gain      = document.getElementById('gain');
  var gainlbl   = document.getElementById('gainlbl');
  var meter     = document.getElementById('meter');
  var dlBtn     = document.getElementById('dl');
  var dllbl     = document.getElementById('dllbl');
  var statusEl  = document.getElementById('status');
  var vid       = document.getElementById('vid');
  var aud       = document.getElementById('aud');
  var chipsWrap = document.querySelector('.chips');
  var fxBass    = document.getElementById('fx_bass'), fxBassL = document.getElementById('fx_basslbl');
  var fxTreb    = document.getElementById('fx_treb'), fxTrebL = document.getElementById('fx_treblbl');

  var audioBuf = null;      // dekodiert (nur für Export)
  var origName = 'lied';
  var isVideo  = false;
  var mediaURL = null;

  // Klang-Zustand (EQ + Breite + Loudness)
  var fx = { subbass:0, bass:0, mid:0, treble:0, width:1.0, loud:false };
  var PRESETS = {
    warmlux: { subbass:5, bass:3, mid:0,  treble:3, width:1.4, loud:true  },
    concert: { subbass:4, bass:4, mid:-1, treble:2, width:1.6, loud:true  },
    studio:  { subbass:1, bass:1, mid:1,  treble:3, width:1.1, loud:false },
    autobass:{ subbass:7, bass:6, mid:-1, treble:2, width:1.2, loud:true  }
  };
  var activePreset = '';

  function dbToGain(db){ return Math.pow(10, db/20); }
  function setStatus(t){ statusEl.textContent = t || ''; }
  function currentDb(){ return parseInt(gain.value,10) || 0; }

  // ---- EQ / Breite / Kette ----
  function makeEq(c){
    var sub =c.createBiquadFilter(); sub.type='lowshelf';  sub.frequency.value=70;
    var bass=c.createBiquadFilter(); bass.type='peaking';  bass.frequency.value=150;  bass.Q.value=0.9;
    var mid =c.createBiquadFilter(); mid.type='peaking';   mid.frequency.value=1000;  mid.Q.value=0.8;
    var treb=c.createBiquadFilter(); treb.type='highshelf';treb.frequency.value=7000;
    sub.connect(bass); bass.connect(mid); mid.connect(treb);
    return { first:sub, last:treb, sub:sub, bass:bass, mid:mid, treb:treb };
  }
  function applyEq(eq){ eq.sub.gain.value=fx.subbass; eq.bass.gain.value=fx.bass; eq.mid.gain.value=fx.mid; eq.treb.gain.value=fx.treble; }
  function makeWidth(c){
    var sp=c.createChannelSplitter(2);
    var Lm=c.createGain(); Lm.gain.value=0.5; var Rm=c.createGain(); Rm.gain.value=0.5;
    sp.connect(Lm,0); sp.connect(Rm,1);
    var mid=c.createGain(); Lm.connect(mid); Rm.connect(mid);
    var Ls=c.createGain(); var Rs=c.createGain(); sp.connect(Ls,0); sp.connect(Rs,1);
    var side=c.createGain(); Ls.connect(side); Rs.connect(side);
    var sideNeg=c.createGain(); sideNeg.gain.value=-1; side.connect(sideNeg);
    var Lout=c.createGain(); mid.connect(Lout); side.connect(Lout);
    var Rout=c.createGain(); mid.connect(Rout); sideNeg.connect(Rout);
    var mg=c.createChannelMerger(2); Lout.connect(mg,0,0); Rout.connect(mg,0,1);
    return { first:sp, last:mg, Ls:Ls, Rs:Rs };
  }
  function applyWidth(w){ w.Ls.gain.value=0.5*fx.width; w.Rs.gain.value=-0.5*fx.width; }

  function buildChain(c, src, driveFactor, channels, store, live){
    var eq=makeEq(c); applyEq(eq); src.connect(eq.first);
    var node=eq.last, width=null;
    if(channels>=2){ width=makeWidth(c); applyWidth(width); eq.last.connect(width.first); node=width.last; }
    var i=currentDb()/24, loud=fx.loud?1:0;
    var drive=c.createGain(); drive.gain.value=driveFactor*(1+loud*0.6);
    var comp=c.createDynamicsCompressor();
    if(live){
      // Live: sanfter „Glue"-Kompressor – fest, kein Pumpen/Leiern, langsamer Attack
      comp.threshold.value=-8; comp.knee.value=12; comp.ratio.value=3.5; comp.attack.value=0.012; comp.release.value=0.28;
    } else {
      // Export: dichtes Mastering
      comp.threshold.value=-3-i*7-loud*6; comp.knee.value=6; comp.ratio.value=6+i*14+loud*4; comp.attack.value=0.003; comp.release.value=0.25;
    }
    var lim=c.createDynamicsCompressor();
    lim.threshold.value=live?-1:-1.5; lim.knee.value=live?2:0; lim.ratio.value=live?8:20;
    lim.attack.value=live?0.004:0.001; lim.release.value=live?0.12:0.05;
    var trim=c.createGain(); trim.gain.value=live?0.95:0.9;
    // Ausgangs-Lautstärke NACH dem Limiter: Regler = klar hörbar leise..laut, ohne Clipping
    var out=c.createGain(); out.gain.value = live ? volLevel() : 1;
    node.connect(drive); drive.connect(comp); comp.connect(lim); lim.connect(trim); trim.connect(out);
    if(store){ store.eq=eq; store.width=width; store.drive=drive; store.comp=comp; store.out=out; }
    return out;
  }

  var audioPeak = 1;  // einmal beim Laden gemessen (nicht bei jedem Regler neu!)
  function peakOf(buf){
    var p=0;
    for(var ch=0; ch<buf.numberOfChannels; ch++){ var d=buf.getChannelData(ch); for(var i=0;i<d.length;i++){ var a=Math.abs(d[i]); if(a>p)p=a; } }
    return p || 1;
  }
  // Normalisierter Boost: erst Peak->0.99, dann Stufe. Live sanft gedeckelt (kein Pumpen/Leiern).
  function totalGain(){ var norm = audioBuf ? (0.99/audioPeak) : 1; return norm * dbToGain(currentDb()); }

  // ==== LIVE: Media-Element (Audio/Video) -> Live-Kette (EQ live, kein Neustart) ====
  var mctx=null, graphs=new WeakMap();
  var mStore=null, mAnalyser=null, mDest=null, mEl=null, mRaf=0;
  // Fester Dichte-Boost (Klang/Druck) – unabhängig vom Lautstärke-Regler
  function densityBoost(){ return (audioBuf ? (0.99/audioPeak) : 1) * dbToGain(10); }
  // Lautstärke-Regler 0..24 -> Ausgangspegel 0.18..1.0 (klar hörbar)
  function volLevel(){ return 0.18 + (currentDb()/24)*0.82; }
  function buildMediaGraph(el){
    if(!mctx) mctx = new (window.AudioContext||window.webkitAudioContext)();
    var g = graphs.get(el);
    if(!g){
      var src = mctx.createMediaElementSource(el);   // je Element nur 1x erlaubt
      var analyser = mctx.createAnalyser(); analyser.fftSize=512;
      var dest = mctx.createMediaStreamDestination();
      var store = {};
      var last = buildChain(mctx, src, densityBoost(), 2, store, true); // live = sanfte Kette
      last.connect(analyser); analyser.connect(mctx.destination); analyser.connect(dest);
      g = { src:src, store:store, analyser:analyser, dest:dest };
      graphs.set(el, g);
    }
    mEl=el; mStore=g.store; mAnalyser=g.analyser; mDest=g.dest;
  }
  // Nur EQ/Breite/Lautstärke live ändern – Kompressor fest (stabil, kein Pumpen)
  function updateMediaFx(){
    if(!mctx || !mStore || !mStore.eq) return;
    applyEq(mStore.eq); if(mStore.width) applyWidth(mStore.width);
    var loud=fx.loud?1:0;
    mStore.drive.gain.value = densityBoost()*(1+loud*0.6);   // Klang/Druck (fest)
    if(mStore.out) mStore.out.gain.value = volLevel();         // Lautstärke-Regler (hörbar)
  }
  function meterTick(){
    if(!mAnalyser){ return; }
    var data=new Uint8Array(mAnalyser.frequencyBinCount);
    (function tick(){
      if(!mEl || mEl.paused){ meter.style.width='0%'; mRaf=0; return; }
      mAnalyser.getByteTimeDomainData(data);
      var m=0; for(var i=0;i<data.length;i++){ var v=Math.abs(data[i]-128)/128; if(v>m)m=v; }
      meter.style.width=Math.min(100,m*100)+'%';
      mRaf=requestAnimationFrame(tick);
    })();
  }
  function attachMedia(el){
    el.addEventListener('play', function(){
      buildMediaGraph(el);
      if(mctx.state==='suspended') mctx.resume();
      updateMediaFx();
      if(!mRaf) meterTick();
    });
    el.addEventListener('pause', function(){ if(mRaf){ cancelAnimationFrame(mRaf); mRaf=0; } meter.style.width='0%'; });
  }
  attachMedia(aud); attachMedia(vid);

  function stopMedia(){
    try{ aud.pause(); }catch(e){} try{ vid.pause(); }catch(e){}
    if(mRaf){ cancelAnimationFrame(mRaf); mRaf=0; }
    meter.style.width='0%';
  }

  // ==== PREMIUM-EXPORT (nur Audio): Oversampling -> True-Peak -> LUFS -> 24-bit ====
  var CEIL = Math.pow(10,-1/20);  // -1 dBTP
  var LUFS_TARGET = -10;
  function softLimit(chs, sr, ceiling){
    var n=chs[0].length, nc=chs.length, atk=Math.exp(-1/(sr*0.002)), rel=Math.exp(-1/(sr*0.08)), g=1;
    for(var i=0;i<n;i++){
      var p=0; for(var c=0;c<nc;c++){ var a=Math.abs(chs[c][i]); if(a>p)p=a; }
      var req=p>ceiling?ceiling/p:1, coef=req<g?atk:rel;
      g=coef*g+(1-coef)*req; if(g>req)g=req;
      for(var c2=0;c2<nc;c2++) chs[c2][i]*=g;
    }
  }
  function measureLUFS(buf){
    var s1b0=1.53512485958697,s1b1=-2.69169618940638,s1b2=1.19839281085285,s1a1=-1.69065929318241,s1a2=0.73248077421585;
    var s2b0=1,s2b1=-2,s2b2=1,s2a1=-1.99004745483398,s2a2=0.99007225036621, sum=0;
    for(var ch=0; ch<buf.numberOfChannels; ch++){
      var d=buf.getChannelData(ch), x1=0,x2=0,y1=0,y2=0,z1=0,z2=0,w1=0,w2=0,ms=0;
      for(var i=0;i<d.length;i++){
        var x=d[i];
        var y=s1b0*x+s1b1*x1+s1b2*x2 - s1a1*y1 - s1a2*y2; x2=x1;x1=x;y2=y1;y1=y;
        var w=s2b0*y+s2b1*z1+s2b2*z2 - s2a1*w1 - s2a2*w2; z2=z1;z1=y;w2=w1;w1=w;
        ms+=w*w;
      }
      sum += ms/(d.length||1);
    }
    return -0.691 + 10*Math.log10(sum+1e-12);
  }
  function resampleBuffer(inBuf, targetRate){
    return new Promise(function(resolve,reject){
      var Off=window.OfflineAudioContext||window.webkitOfflineAudioContext;
      var len=Math.max(1, Math.ceil(inBuf.duration*targetRate));
      var off=new Off(inBuf.numberOfChannels, len, targetRate);
      var s=off.createBufferSource(); s.buffer=inBuf;
      var lp=off.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(targetRate*0.45,20000); lp.Q.value=0.707;
      s.connect(lp); lp.connect(off.destination); s.start();
      off.startRendering().then(resolve).catch(reject);
    });
  }
  function renderLoud(){
    var Off=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    if(!Off) return Promise.reject('Browser kann nicht exportieren.');
    var sr=audioBuf.sampleRate, osRate=Math.min(4*sr,192000);
    var len=Math.max(1, Math.ceil(audioBuf.duration*osRate));
    var off=new Off(audioBuf.numberOfChannels, len, osRate);
    var src=off.createBufferSource(); src.buffer=audioBuf;
    buildChain(off, src, totalGain(), audioBuf.numberOfChannels, null).connect(off.destination);
    src.start();
    return off.startRendering().then(function(osBuf){
      var chs=[]; for(var c=0;c<osBuf.numberOfChannels;c++) chs.push(osBuf.getChannelData(c));
      softLimit(chs, osRate, CEIL);
      return resampleBuffer(osBuf, sr);
    }).then(function(fin){
      var lufs=measureLUFS(fin), makeup=Math.max(-6,Math.min(4, LUFS_TARGET-lufs)), k=Math.pow(10,makeup/20);
      var chs=[]; for(var c=0;c<fin.numberOfChannels;c++){ var d=fin.getChannelData(c); for(var i=0;i<d.length;i++) d[i]*=k; chs.push(d); }
      softLimit(chs, fin.sampleRate, CEIL);
      fin._lufs=measureLUFS(fin);
      return fin;
    });
  }
  function bufToWav24(buf){
    var numCh=buf.numberOfChannels, len=buf.length, sr=buf.sampleRate, bps=3;
    var dataLen=len*numCh*bps, bytes=44+dataLen, ab=new ArrayBuffer(bytes), v=new DataView(ab);
    function ws(o,s){ for(var i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); }
    ws(0,'RIFF'); v.setUint32(4,bytes-8,true); ws(8,'WAVE'); ws(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,numCh,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*numCh*bps,true);
    v.setUint16(32,numCh*bps,true); v.setUint16(34,24,true); ws(36,'data'); v.setUint32(40,dataLen,true);
    var chans=[]; for(var c=0;c<numCh;c++) chans.push(buf.getChannelData(c));
    var off=44, scale=8388607, q=1/8388607;
    for(var i=0;i<len;i++){
      for(var c2=0;c2<numCh;c2++){
        var s=chans[c2][i] + (Math.random()-Math.random())*q;
        if(s>1)s=1; else if(s<-1)s=-1;
        var val=Math.round(s*scale);
        if(val>8388607)val=8388607; else if(val<-8388608)val=-8388608;
        v.setUint8(off,val&0xFF); v.setUint8(off+1,(val>>8)&0xFF); v.setUint8(off+2,(val>>16)&0xFF); off+=3;
      }
    }
    return new Blob([ab],{type:'audio/wav'});
  }

  // ==== Video-Aufnahme (lautes Video speichern) ====
  var recording=false, mediaRec=null;
  function recordVideo(){
    buildMediaGraph(vid);
    if(mctx.state==='suspended') mctx.resume();
    updateMediaFx();
    var tracks=[];
    var vs = vid.captureStream ? vid.captureStream() : (vid.mozCaptureStream && vid.mozCaptureStream());
    if(vs && vs.getVideoTracks()[0]) tracks.push(vs.getVideoTracks()[0]);
    tracks.push(mDest.stream.getAudioTracks()[0]);
    var stream=new MediaStream(tracks);
    var mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');
    var chunks=[];
    try{ mediaRec=new MediaRecorder(stream, mime?{mimeType:mime}:{}); }
    catch(e){ setStatus('Aufnahme nicht möglich: '+e); dlBtn.disabled=false; return; }
    mediaRec.ondataavailable=function(ev){ if(ev.data&&ev.data.size) chunks.push(ev.data); };
    mediaRec.onstop=function(){
      var ext = mime.indexOf('mp4')>-1?'mp4':'webm';
      var blob=new Blob(chunks,{type:mime||'application/octet-stream'});
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=origName+'_lauter_+'+currentDb()+'dB.'+ext;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
      setStatus('✅ Gespeichert: '+a.download+(ext==='webm'?' (webm)':''));
      recording=false; dlBtn.disabled=false;
    };
    recording=true; dlBtn.disabled=true;
    setStatus('⏺ Nehme auf … läuft einmal komplett durch (bitte warten).');
    vid.currentTime=0; vid.muted=false; mediaRec.start(); vid.play();
    vid.onended=function(){ if(recording && mediaRec.state!=='inactive') mediaRec.stop(); };
  }

  function download(){
    if(isVideo){ recordVideo(); return; }
    if(!audioBuf){ return; }
    dlBtn.disabled=true; setStatus('Studio-Mastering läuft …');
    renderLoud().then(function(out){
      var blob=bufToWav24(out), url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=origName+'_lauter_+'+currentDb()+'dB_24bit.wav';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
      var lu=(typeof out._lufs==='number')?' · '+out._lufs.toFixed(1)+' LUFS':'';
      setStatus('✅ Gespeichert (24-bit'+lu+'): '+a.download);
      dlBtn.disabled=false;
    }).catch(function(e){ setStatus('Fehler: '+e); dlBtn.disabled=false; });
  }

  // ==== Datei laden ====
  function resetMedia(){
    stopMedia();
    if(mediaURL){ URL.revokeObjectURL(mediaURL); mediaURL=null; }
    audioBuf=null; isVideo=false;
    vid.classList.add('hidden'); vid.removeAttribute('src'); try{vid.load();}catch(e){}
    aud.classList.add('hidden'); aud.removeAttribute('src'); try{aud.load();}catch(e){}
  }
  var repeat=false, currentTrackId=null;
  function isMedia(name,type){
    return /^video\//.test(type)||/^audio\//.test(type)||/\.(mp4|mov|m4v|webm|mkv|avi|mp3|m4a|wav|aac|ogg|flac)$/i.test(name||'');
  }
  // Media aus Blob laden (für neue Datei UND Playlist-Eintrag)
  function openMedia(blob, name, type){
    resetMedia();
    origName=(name||'datei').replace(/\.[^.]+$/,'')||'datei';
    fname.textContent=name||'Datei';
    mediaURL=URL.createObjectURL(blob);
    panel.classList.remove('hidden');
    var video=/^video\//.test(type)||/\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(name||'');
    if(video){
      isVideo=true;
      vid.src=mediaURL; vid.loop=repeat; vid.classList.remove('hidden');
      dllbl.textContent='Video speichern';
      buildMediaGraph(vid); updateMediaFx();   // Routing sofort aktiv (iOS)
      setStatus('Video geladen – Play drücken, Klang wählen.');
      return;
    }
    isVideo=false;
    aud.src=mediaURL; aud.loop=repeat; aud.classList.remove('hidden');
    dllbl.textContent='Speichern';
    buildMediaGraph(aud); updateMediaFx();     // Routing sofort aktiv (iOS) -> Lautstärke/EQ wirken
    setStatus('Lade …');
    var reader=new FileReader();
    reader.onload=function(){
      var ac=new (window.AudioContext||window.webkitAudioContext)();
      ac.decodeAudioData(reader.result).then(function(buf){ audioBuf=buf; audioPeak=peakOf(buf); ac.close(); updateMediaFx(); setStatus('Bereit – Play drücken.'); })
      .catch(function(){ ac.close(); setStatus('Diese Datei konnte nicht gelesen werden.'); });
    };
    reader.onerror=function(){ setStatus('Datei-Fehler.'); };
    reader.readAsArrayBuffer(blob);
  }
  function loadFile(f){
    if(!f) return;
    if(!isMedia(f.name,f.type)){ setStatus('Bitte Audio- oder Video-Datei wählen.'); return; }
    openMedia(f, f.name, f.type);
    // Duplikat verhindern: gleiche Datei (Name + Größe) nicht nochmal speichern
    idbAll().then(function(list){
      var dup=null;
      for(var i=0;i<list.length;i++){ var t=list[i]; if(t.name===f.name && t.blob && t.blob.size===f.size){ dup=t; break; } }
      if(dup){ currentTrackId=dup.id; renderList(); return; }
      var id='t'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      currentTrackId=id;
      return idbAdd({id:id, name:f.name, type:f.type||'', blob:f, added:Date.now()}).then(renderList);
    }).catch(function(){});
  }

  // ==== Playlist (IndexedDB – bleibt dauerhaft gespeichert) ====
  var DB=null;
  function idbOpen(){ return new Promise(function(res,rej){
    if(!window.indexedDB){ rej('no-idb'); return; }
    var r=indexedDB.open('lauter_pl',1);
    r.onupgradeneeded=function(){ if(!r.result.objectStoreNames.contains('tracks')) r.result.createObjectStore('tracks',{keyPath:'id'}); };
    r.onsuccess=function(){ DB=r.result; res(DB); };
    r.onerror=function(){ rej(r.error); };
  }); }
  function idbAdd(t){ return new Promise(function(res,rej){ if(!DB){res();return;} try{ var tx=DB.transaction('tracks','readwrite'); tx.objectStore('tracks').put(t); tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }catch(e){ rej(e); } }); }
  function idbAll(){ return new Promise(function(res){ if(!DB){res([]);return;} try{ var tx=DB.transaction('tracks','readonly'); var rq=tx.objectStore('tracks').getAll(); rq.onsuccess=function(){ res((rq.result||[]).sort(function(a,b){return a.added-b.added;})); }; rq.onerror=function(){ res([]); }; }catch(e){ res([]); } }); }
  function idbGet(id){ return new Promise(function(res){ if(!DB){res(null);return;} try{ var tx=DB.transaction('tracks','readonly'); var rq=tx.objectStore('tracks').get(id); rq.onsuccess=function(){res(rq.result||null);}; rq.onerror=function(){res(null);}; }catch(e){ res(null); } }); }
  function idbDel(id){ return new Promise(function(res){ if(!DB){res();return;} try{ var tx=DB.transaction('tracks','readwrite'); tx.objectStore('tracks').delete(id); tx.oncomplete=res; tx.onerror=res; }catch(e){ res(); } }); }

  var plList=document.getElementById('pllist'), plCount=document.getElementById('plcount');
  function renderList(){
    return idbAll().then(function(list){
      plCount.textContent = list.length ? '('+list.length+')' : '';
      plList.innerHTML='';
      if(!list.length){
        var e=document.createElement('div'); e.className='pl-empty';
        e.textContent='Noch keine Musik – oben „Lied / Video wählen".'; plList.appendChild(e); return;
      }
      list.forEach(function(t){
        var isVid=/^video\//.test(t.type)||/\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(t.name);
        var item=document.createElement('div'); item.className='pl-item'+(t.id===currentTrackId?' active':''); item.setAttribute('role','button');
        var ic=document.createElement('span'); ic.className='ic'; ic.textContent=isVid?'🎬':'🎵';
        var nm=document.createElement('span'); nm.className='nm'; nm.textContent=t.name;
        var del=document.createElement('button'); del.className='del'; del.type='button'; del.setAttribute('aria-label','Aus Liste löschen'); del.textContent='🗑';
        item.appendChild(ic); item.appendChild(nm); item.appendChild(del);
        item.addEventListener('click', function(e){ if(e.target===del) return; playTrack(t.id); });
        del.addEventListener('click', function(e){ e.stopPropagation(); idbDel(t.id).then(function(){ if(currentTrackId===t.id) currentTrackId=null; renderList(); }); });
        plList.appendChild(item);
      });
    });
  }
  function playTrack(id){
    idbGet(id).then(function(t){
      if(!t) return;
      currentTrackId=id; openMedia(t.blob, t.name, t.type); renderList();
      setTimeout(function(){ var el=isVideo?vid:aud; if(el && el.play) el.play().catch(function(){}); }, 180);
    });
  }

  // ==== Regler / Presets (LIVE) ====
  function rangeFill(el){ var mn=+el.min, mx=+el.max, p=(parseFloat(el.value)-mn)/(mx-mn)*100; el.style.setProperty('--p', p+'%'); }
  function updateGainLabel(){ gainlbl.textContent=Math.round(volLevel()*100)+' %'; rangeFill(gain); }
  function updateFxLabels(){
    fxBassL.textContent=(fx.bass>0?'+':'')+fx.bass+' dB';
    fxTrebL.textContent=(fx.treble>0?'+':'')+fx.treble+' dB';
    fxBass.value=fx.bass; fxTreb.value=fx.treble;
    rangeFill(fxBass); rangeFill(fxTreb);
  }
  function markPreset(name){
    activePreset=name||'';
    chipsWrap.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.preset===activePreset?'true':'false'); });
  }
  function applyPreset(name){
    var p=PRESETS[name]; if(!p) return;
    fx.subbass=p.subbass; fx.bass=p.bass; fx.mid=p.mid; fx.treble=p.treble; fx.width=p.width; fx.loud=p.loud;
    updateFxLabels(); markPreset(name); updateMediaFx();
  }

  pickBtn.addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(e){ if(e.target.files[0]) loadFile(e.target.files[0]); });
  chipsWrap.addEventListener('click', function(e){ var b=e.target.closest('button'); if(b) applyPreset(b.dataset.preset); });
  gain.addEventListener('input', function(){ updateGainLabel(); updateMediaFx(); });
  fxBass.addEventListener('input', function(){ fx.bass=parseInt(fxBass.value,10)||0; updateFxLabels(); markPreset(''); updateMediaFx(); });
  fxTreb.addEventListener('input', function(){ fx.treble=parseInt(fxTreb.value,10)||0; updateFxLabels(); markPreset(''); updateMediaFx(); });
  dlBtn.addEventListener('click', download);

  var repBtn=document.getElementById('rep');
  repBtn.addEventListener('click', function(){
    repeat=!repeat; repBtn.setAttribute('aria-pressed', repeat?'true':'false');
    aud.loop=repeat; vid.loop=repeat;
  });

  // iOS: AudioContext bei jeder Berührung aufwecken (sonst wirken Lautstärke/EQ nicht)
  function resumeCtx(){ if(mctx && mctx.state==='suspended'){ mctx.resume(); updateMediaFx(); } }
  document.addEventListener('touchend', resumeCtx, {passive:true});
  document.addEventListener('click', resumeCtx);

  // Start-Klang (sofort gut)
  applyPreset('warmlux');
  updateGainLabel();

  // Playlist laden (gespeicherte Musik zeigen)
  idbOpen().then(renderList).catch(function(){ renderList(); });

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); });
  }
})();
</script>
</body>
